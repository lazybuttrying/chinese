[package]
name = "hanji"
version = "1.0.0"
edition = "2024"
description = "A visual HSK 1 word game powered by Rust and Axum"
publish = false

[dependencies]
axum = "0.8"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
vercel_runtime = { version = "2.4", features = ["axum"] }

[[bin]]
name = "hanji"
path = "api/hanji.rs"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
strip = true
